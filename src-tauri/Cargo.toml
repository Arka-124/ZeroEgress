[package]
name = "zeroegress"
version = "3.0.0"
description = "ZeroEgress — Air-Gapped Client-Side File Utilities"
authors = ["ZeroEgress Team"]
edition = "2021"

[lib]
name = "zeroegress_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
lopdf = "0.33"
sha2 = "0.10"
md-5 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast"] }
base64 = "0.22"
notify = "6.1"
flate2 = "1.0"

[profile.release]
opt-level = "z"     # Optimize for size (< 20 MB installer)
lto = true          # Enable link-time optimization
codegen-units = 1   # Maximize size optimizations
panic = "abort"     # Remove unwind tables
strip = true        # Strip symbols from binary
