<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="canonical" href="https://zeroegress.app/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroEgress — Air-Gapped 100% Client-Side File Utility Suite</title>
    <meta
      name="description"
      content="Air-gapped, zero-server-upload file utilities running 100% in your browser. Instant image converter (AVIF/WebP), PDF split & merge, deep EXIF scrubber, structured data converter, and WebAssembly media transcoder."
    />
    <meta
      name="keywords"
      content="client-side file converter, offline PWA, air-gapped utility, image converter, webp avif converter, pdf split merge, exif stripper, json csv yaml converter, ffmpeg wasm media converter, privacy first"
    />
    <meta name="author" content="ZeroEgress" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="ZeroEgress" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZeroEgress" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('zeroegress-theme');
          var isDark = saved ? saved === 'dark' : true;
          if (!isDark) {
            document.documentElement.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f8fafc');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zeroegress.app/" />
    <meta property="og:title" content="ZeroEgress — Air-Gapped 100% Client-Side File Utilities" />
    <meta
      property="og:description"
      content="Private, air-gapped web utility suite. Zero server uploads, zero telemetry, instant image conversions, PDF manipulation, EXIF stripping, and WebAssembly media transcoding."
    />
    <meta property="og:image" content="https://zeroegress.app/favicon.svg" />
    <meta property="og:site_name" content="ZeroEgress" />

    <meta
      name="twitter:description"
      content="100% Client-Side Web Utilities with Zero Server Uploads. Image converter, PDF tools, EXIF stripper, JSON/CSV/YAML formatter, and FFmpeg media transcoder."

    <meta name="twitter:image" content="https://zeroegress.app/favicon.svg" />

        ]

  </head>
  <body class="bg-zinc-950 text-zinc-100 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen">
